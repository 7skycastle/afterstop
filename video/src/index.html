<style>

#secbar{width:160px;height:3px;background:rgba(255,255,255,.22);margin-left:10px;position:relative}

/* 앱 화면 (에뮬레이터 녹화 2560×1600 좌표계) */
.vp{position:absolute;left:60px;top:132px;width:1140px;height:712px;border-radius:20px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 10px #0a0f22,0 0 0 11px rgba(255,255,255,.12),0 40px 90px rgba(0,0,0,.5)}

<body>
<div id="stage">
  <div id="sec" class="abs"><b id="secn">01</b><span id="sect"></span><div id="secbar"><div id="secfill"></div></div></div>
  <div id="scenes"></div>
  <svg id="arrows"></svg>
  <div id="sub" class="abs"><div id="subbox"></div></div>
</div>
<script src="timeline.js"></script>
<script src="clips.js"></script>
<script>
'use strict';
const TL=window.TL,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const P=(t,a,d=.6)=>eo(clamp((t-a)/d));
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
function rise(el,t,a,d=.7,dy=26){const k=P(t,a,d);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`;return k;}
function win(t,a,b,f=.35){return Math.min(P(t,a,f),1-P(t,b,f));}
const VP={x:60,y:132,w:1140,h:712};
const W=2560,H=1600;   // 에뮬레이터 화면 좌표계 (1440×900 프레임을 2560×1600 크기로 표시)
const FULL={x:1280,y:800,w:2560};

function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;}}
function roughOval(x1,y1,x2,y2,seed,pad=10){
  const r=rnd(seed),cx=(x1+x2)/2,cy=(y1+y2)/2,rx=(x2-x1)/2+pad,ry=(y2-y1)/2+pad*.8;
  const a0=-2.2+r()*.6,n=46,pts=[];
  for(let i=0;i<=n;i++){const a=a0+(Math.PI*2+.45)*i/n;const j=1+(r()-.5)*.035+ .03*Math.sin(i/n*Math.PI*2);
    pts.push([cx+Math.cos(a)*rx*j,cy+Math.sin(a)*ry*(j+(i/n)*.06)]);}
  return 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
}
function ring(seed){return `<svg viewBox="-15 -15 30 30"><path d="${roughOval(-9,-9,9,9,seed,0)}" fill="none" stroke="#FFD43B" stroke-width="3.6" stroke-linecap="round"/></svg>`;}

/* ---------- 녹화 클립 레이어 ---------- */
// L = {clip, sync:[장면시각, 클립시각], rate, hold(최대 클립시각), show:[a,b], keys:[{t,x,y,w,m}], hls:[{r:[x1,y1,x2,y2],t0,t1,arrow,pad}]}
function frameSrc(L,t){
  const n=window.CLIPLEN[L.clip];let ct=L.sync[1]+(t-L.sync[0])*(L.rate||1);
  if(L.hold!=null)ct=Math.min(ct,L.hold);
  const f=clamp(Math.round(ct*FPS)+1,1,n);
  return `clips/${L.clip}/${String(f).padStart(5,'0')}.jpg`;
}
function makeVP(sc,layers){
  const vp=$(`<div class="vp"></div>`);sc.el.appendChild(vp);
  layers.forEach((L,li)=>{L.W=W;L.H=H;
    L.el=$(`<div class="layer" style="width:${W}px;height:${H}px"><img style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"></svg></div>`);
    L.img=L.el.querySelector('img');vp.appendChild(L.el);const svg=L.el.querySelector('svg');
    L.hls=(L.hls||[]).map((b,i)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',roughOval(...b.r,li*17+i*7+sc.n*31,b.pad??16));p.setAttribute('fill','none');p.setAttribute('stroke','#FFD43B');
      p.setAttribute('stroke-linecap','round');p.setAttribute('pathLength','1');p.setAttribute('stroke-dasharray','1');svg.appendChild(p);b.el=p;return b;});
    if(!L.keys)L.keys=[{t:0,...FULL}];
  });
  sc.vp=vp;sc.layers=layers;
}
function camAt(L,t){
  const k=L.keys;let a=k[0],b=k[0],m=0;
  for(let i=1;i<k.length;i++){const kk=k[i],dur=kk.m||1.4;
    if(t>=kk.t){a=b=kk;m=0;continue}
    if(t>kk.t-dur){a=k[i-1];b=kk;m=eio((t-(kk.t-dur))/dur);}
    break;}
  let w=Math.exp(Math.log(a.w)+(Math.log(b.w)-Math.log(a.w))*m),x=a.x+(b.x-a.x)*m,y=a.y+(b.y-a.y)*m;
  w=Math.min(w,L.W);const h=w*VP.h/VP.w;
  x=clamp(x,w/2,L.W-w/2);y=h>=L.H?L.H/2:clamp(y,h/2,L.H-h/2);
  return {x,y,s:VP.w/w};
}
const pending=[];
function drawVP(sc,t){
  for(const L of sc.layers){
    const op=L.show?win(t,L.show[0],L.show[1],.45):1;L.el.style.opacity=op;L.el.style.display=op>0?'block':'none';
    if(op<=0)continue;
    const src=frameSrc(L,t);if(L.cur!==src){L.cur=src;L.img.src=src;pending.push(L.img);}
    const c=camAt(L,t);L.cam=c;
    L.el.style.transform=`translate(${VP.w/2-c.x*c.s}px,${VP.h/2-c.y*c.s}px) scale(${c.s})`;
    for(const b of L.hls){const o=win(t,b.t0,b.t1??999,.3);b.el.style.opacity=o;
      b.el.setAttribute('stroke-width',(5/c.s).toFixed(2));b.el.setAttribute('stroke-dashoffset',(1-P(t,b.t0,.75)).toFixed(3));}
  }
}
function toStage(L,ix,iy){const c=L.cam;return [VP.x+VP.w/2+(ix-c.x)*c.s,VP.y+VP.h/2+(iy-c.y)*c.s];}
function makeCol(sc,o){
  const col=$(`<div class="col"></div>`);sc.el.appendChild(col);
  sc.eb=$(`<div class="eyebrow">${o.eyebrow}</div>`);col.appendChild(sc.eb);
  sc.ti=$(`<div class="title">${o.title.replace(/\n/g,'<br>')}</div>`);col.appendChild(sc.ti);
  if(o.size)sc.ti.style.fontSize=o.size+'px';
  sc.buls=(o.bullets||[]).map((b,i)=>{b.el=$(`<div class="bul">${ring(sc.n*13+i)}<div class="t">${b.text}</div>${b.sub?`<div class="s">${b.sub}</div>`:''}</div>`);
    col.appendChild(b.el);b.marks=[...b.el.querySelectorAll('mark')];return b;});
  if(o.stat){sc.stat=$(`<div class="stat"><div class="v">${o.stat.v}</div><div class="k">${o.stat.k}</div></div>`);sc.stat.t=o.stat.t;if(o.stat.left)sc.stat.style.left=o.stat.left+'px';sc.el.appendChild(sc.stat);}
  if(o.disc){sc.disc=$(`<div class="disc">${o.disc}</div>`);sc.el.appendChild(sc.disc);}
  if(sc.app){sc.voice=$(`<div class="voice"><i><span></span><span></span><span></span><span></span><span></span></i>앱 음성 안내 · 하윤 녹음</div>`);sc.el.appendChild(sc.voice);sc.bars=[...sc.voice.querySelectorAll('span')];}
}
function drawCol(sc,t){
  rise(sc.eb,t,.2);rise(sc.ti,t,.35);
  for(const b of sc.buls){rise(b.el,t,b.t,.6,18);const k=P(t,b.t+.45,.8);b.marks.forEach(m=>m.style.backgroundSize=`${k*100}% 42%`);}
  if(sc.stat){const k=P(t,sc.stat.t,.8);sc.stat.style.opacity=k;sc.stat.style.transform=`translateX(${(1-k)*30}px)`;}
  if(sc.disc)rise(sc.disc,t,.8,.6,10);
  if(sc.vp){const k=P(t,0,.9);sc.vp.style.opacity=k;sc.vp.style.transform=`translateX(${(1-k)*-40}px)`;}
  if(sc.voice){const a=sc.app,o=win(t,a.start-.25,a.end+.2,.3);sc.voice.style.opacity=o;sc.voice.style.transform=`translateY(${(1-o)*-12}px)`;
    sc.bars.forEach((s,i)=>{s.style.height=(6+14*Math.abs(Math.sin(t*9+i*1.3)))+'px'});}
}
function arrowPath(sc,t){
  let out='';const st=document.getElementById('stage').getBoundingClientRect(),sk=st.width/1920;
  for(const L of sc.layers||[])for(const b of L.hls){
    if(b.arrow==null)continue;
    const o=win(t,b.t0+.2,b.t1??999)*(L.show?win(t,L.show[0],L.show[1],.45):1);if(o<=.01)continue;
    const bul=sc.buls[b.arrow];if(!bul||+bul.el.style.opacity<.5)continue;
    const r=bul.el.querySelector('svg').getBoundingClientRect();
    const x1=(r.left-st.left)/sk-6,y1=(r.top-st.top)/sk+r.height/sk/2;
    let [x2,y2]=toStage(L,b.r[2]+(b.pad??16),(b.r[1]+b.r[3])/2);x2+=12;
    x2=Math.min(x2,VP.x+VP.w+4);y2=clamp(y2,VP.y+20,VP.y+VP.h-20);
    const cx=(x1+x2)/2+30,cy=Math.max(y1,y2)+70,d=P(t,b.t0+.2,.9),ang=Math.atan2(y2-cy,x2-cx);
    const ah=`M${x2},${y2} L${x2-20*Math.cos(ang-.5)},${y2-20*Math.sin(ang-.5)} M${x2},${y2} L${x2-20*Math.cos(ang+.5)},${y2-20*Math.sin(ang+.5)}`;
    out+=`<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-d}" fill="none" stroke="#FFD43B" stroke-width="3.6" stroke-linecap="round" opacity="${o}"/>`;
    if(d>.97)out+=`<path d="${ah}" fill="none" stroke="#FFD43B" stroke-width="3.6" stroke-linecap="round" opacity="${o}"/>`;
  }
  return out;
}

/* 데모 화면 공통 좌표 (2560×1600) */
const RG={scene:[252,579,1373,1046],tele:[252,1069,646,1107],chip2:[480,1126,694,1197],chip3:[708,1126,920,1197],chip4:[936,1126,1130,1197],chip5:[1143,1126,1306,1197],
  guide:[1478,378,2490,589],cue:[1478,1350,2490,1504],immobile:[1478,851,1811,960],head:[252,384,1376,448]};

/* ---------- 장면 ---------- */
const SEC={2:['01','사고 후보 감지'],3:['02','장면 확보 · 분석'],4:['03','상황별 안내'],5:['04','판단 보류'],6:['05','실제 입력'],7:['06','구조 · 기록']};
const BUILD={
1(sc,L,E){
  const e=sc.el;
  sc.cards=[
    {el:$(`<div class="card" style="left:1020px;top:170px;width:760px;height:475px"><img src="assets/tablet_home.jpg"></div>`),r:-3,dx:-10},
    {el:$(`<div class="card" style="left:1560px;top:330px;width:270px;height:600px;border-radius:30px"><img src="assets/phone_home.png"></div>`),r:5,dx:12,late:true}];
  sc.cards.forEach(c=>e.appendChild(c.el));
  sc.eb=$(`<div class="abs" style="left:126px;top:250px;font-size:31px;font-weight:600;color:#b9c8f0">블랙박스 AI 사고 안내 · 안드로이드 앱</div>`);
  sc.big=$(`<div class="abs" style="left:118px;top:300px;font-size:150px;font-weight:900;letter-spacing:-5px;line-height:1.06">멈춘 다음</div>`);
  sc.ul=$(`<div class="abs" style="left:122px;top:480px;height:9px;width:640px;background:var(--yel);border-radius:5px;transform-origin:0 0"></div>`);
  sc.tag=$(`<div class="abs" style="left:126px;top:518px;font-size:36px;font-weight:700;color:var(--yel)">감지 → 영상 확보 → 분석 → 음성 안내 → 기록</div>`);
  sc.goal=$(`<div class="abs" style="left:126px;top:620px;width:860px"><div style="font-size:40px;font-weight:800;letter-spacing:-1px"><span style="display:inline-block;font-size:22px;font-weight:800;color:#122466;background:var(--yel);padding:4px 12px;border-radius:7px;vertical-align:middle;margin-right:16px">구현</span>Kotlin · Jetpack Compose · CameraX</div>
    <div style="font-size:21px;color:#b9c8f0;margin-top:12px">휴대폰·태블릿 실행 · 서버 없이 제품 시연 · 실제 카메라·영상 파일·분석 서버 연결</div></div>`);
  [sc.eb,sc.big,sc.ul,sc.tag,sc.goal].forEach(x=>e.appendChild(x));
  sc.draw=t=>{
    sc.cards.forEach((c,i)=>{const a=c.late?L(1)+.3:.15,k=P(t,a,1.1);c.el.style.opacity=k;
      c.el.style.transform=`translate(${(1-k)*(c.late?60:120)+c.dx*t/20}px,${(1-k)*(c.late?60:30)}px) rotate(${c.r}deg) scale(${.95+.05*k})`;});
    rise(sc.eb,t,.2);rise(sc.big,t,.35,.9,40);sc.ul.style.transform=`scaleX(${P(t,1.0,.9)})`;
    rise(sc.tag,t,L(0)+.4);rise(sc.goal,t,L(1)+.6);
  };
},
2(sc,L,E){
  makeVP(sc,[
    {clip:'t_highway',sync:[0,3.0],hold:6.5,keys:[{t:0,...FULL},{t:2.2,m:1.5,x:820,y:930,w:1500},{t:L(1)+.4,m:1.5,x:1880,y:700,w:1500}],
      hls:[{r:RG.tele,t0:1.8,t1:L(1),arrow:0},{r:RG.chip2,t0:3.1,t1:L(1),arrow:2,pad:12},{r:RG.guide,t0:L(1)+.6,arrow:3}]}]);
  makeCol(sc,{eyebrow:'사고 후보 감지',title:'조건이 함께 맞을 때만\n사고 후보로',size:54,
    bullets:[{text:'충격 <b>2.5 g</b> 이상',t:L(0)+.6},{text:'2초 안에 <b>25 km/h</b> 이상 감속',t:L(0)+2.2},{text:'<b>5 km/h</b> 이하 정차',t:L(0)+3.6},
      {text:'감지 즉시 <mark>공통 안내</mark> 시작',sub:'확정 사고 판정이 아닙니다',t:L(1)+.3}],
    stat:{v:'<small>예시 충격</small>3.1 g',k:'시제품 시험 기준 · 인증된 감지 기준 아님',t:L(0)+1.6,left:1400},
    disc:'합성 시연 장면 · 예시 차량 신호 · 에뮬레이터 실행 화면'});
},
3(sc,L,E){
  const A=sc.app.start;
  makeVP(sc,[
    {clip:'t_highway',sync:[0,6.0],rate:.7,keys:[{t:0,...FULL},{t:L(0)+.3,m:1.4,x:820,y:1000,w:1500},{t:L(1)+.2,m:1.5,x:1960,y:1180,w:1400},{t:A-.3,m:1.3,x:1960,y:640,w:1400}],
      hls:[{r:RG.chip3,t0:L(0)+.3,t1:L(0)+2.2,arrow:0,pad:12},{r:RG.chip4,t0:L(0)+2.2,t1:L(1),arrow:1,pad:12},{r:RG.cue,t0:L(1)+.6,t1:A-.2,arrow:2},{r:RG.guide,t0:A,arrow:3}]}]);
  makeCol(sc,{eyebrow:'전후 장면 · 분석',title:'확인된 단서만\n안내에 반영',

    판단하지 않는 것은 분명히,<br><span style="color:var(--yel)">확인한 사실</span>만으로 다음 행동을</div>`);
  const T=[['assets/tablet_highway.png','고속도로 정차',368,230],['assets/tablet_tunnel.png','이동 어려움 우선',368,230],['assets/tablet_lowlight.png','판단 보류',368,230],['assets/phone_demo.png','휴대폰 세로 화면',104,230]];

    <div style="font-size:34px;font-weight:600;color:#b9c8f0;margin-bottom:6px">블랙박스 AI 사고 안내</div>

    <div style="font-size:38px;font-weight:700;color:var(--yel)">사고 직후의 첫 몇 분, 확인한 사실만으로</div>
    <div style="font-size:21px;color:#a9b8e0;margin-top:64px">Android 에뮬레이터 실제 실행 화면 · 합성 시연 장면과 예시 응답 · 시험용 고정 응답 서버 · 실제 AI 모델 추론·실차·현대차 연동 검증 전</div></div>`);

    sc.thumbs.forEach((th,i)=>{const k=P(t,.8+i*.2,.8);th.style.opacity=k*out;th.style.transform=`translateY(${(1-k)*40}px)`;});
    sc.note.style.opacity=P(t,L(1)+.3,.8)*out;

/* ---------- 조립 ---------- */
const scenes=TL.scenes.map(T=>{
  const sc={...T,el:$(`<section class="scene"></section>`),layers:[],buls:[]};
  document.getElementById('scenes').appendChild(sc.el);
  const L=i=>T.lines[i].start,E=i=>T.lines[i].end;
  BUILD[T.n](sc,L,E);return sc;});
const subbox=document.getElementById('subbox'),secEl=document.getElementById('sec');
function render(t){
  let arrows='',cur=null;pending.length=0;
  for(const sc of scenes){
    const lt=t-sc.start,end=sc.dur,first=sc.n===1,last=sc.n===scenes.length;
    const op=Math.min(first?1:clamp((lt+.3)/.6),last?1:clamp((end+.3-lt)/.6));
    sc.el.style.opacity=op;sc.el.style.display=op>0?'block':'none';
    if(op<=0)continue;
    if(lt>=0&&lt<end)cur=sc;
    const tt=Math.max(lt,0);
    if(sc.draw)sc.draw(tt);else{drawVP(sc,tt);drawCol(sc,tt);}
    if(sc.layers.length&&op>.5)arrows+=arrowPath(sc,tt);
  }
  document.getElementById('arrows').innerHTML=arrows;
  cur=cur||scenes[scenes.length-1];
  const lt=t-cur.start,s=SEC[cur.n];
  secEl.style.opacity=s?P(lt,.1,.5):0;
  if(s){document.getElementById('secn').textContent=s[0];document.getElementById('sect').textContent=s[1];
    document.getElementById('secfill').style.width=(clamp(lt/cur.dur)*160)+'px';}
  let html='',o=0,app=false;
  if(!(cur.hideSub&&lt>cur.hideSub)){
    const items=cur.lines.map(l=>({...l}));if(cur.app)items.push({...cur.app,app:true});
    items.forEach((l,i)=>{const nx=i+1<items.length?items[i+1].start-.05:cur.dur-.2,b=Math.min(nx,l.end+.8);
      if(lt>=l.start-.1&&lt<b){html=(l.app?'<span class="chip">앱 음성</span>':'')+l.sub.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');app=!!l.app;
        o=Math.min(clamp((lt-l.start+.1)/.15),clamp((b-lt)/.15));}});}
  if(subbox.innerHTML!==html)subbox.innerHTML=html;
  subbox.classList.toggle('app',app);
  subbox.style.opacity=html?o:0;
  return Promise.all(pending.map(i=>i.decode().catch(()=>{})));
}
window.R=render;
window.READY=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>document.fonts.load('800 40px Pretendard')).then(()=>document.fonts.load('800 40px NumKR')).then(()=>true);
const q=new URLSearchParams(location.search);
function fit(){if(q.has('render'))return;const s=Math.min(innerWidth/1920,innerHeight/1080),st=document.getElementById('stage');
  st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1920*s)/2+'px';st.style.top=(innerHeight-1080*s)/2+'px';}
addEventListener('resize',fit);fit();
let T0=+(q.get('t')||0);render(T0);
if(!q.has('render')){
  const au=new Audio('../output/멈춘다음_시연영상_음성.m4a');let playing=false;
  const loop=()=>{if(!playing)return;render(au.currentTime);requestAnimationFrame(loop)};
  addEventListener('keydown',e=>{if(e.code==='Space'){playing=!playing;if(playing){au.currentTime=T0;au.play().catch(()=>{});loop()}else{au.pause();T0=au.currentTime}}
    if(e.code==='ArrowRight'||e.code==='ArrowLeft'){T0=clamp((playing?au.currentTime:T0)+(e.code==='ArrowRight'?5:-5),0,TL.total);au.currentTime=T0;render(T0)}});
}
