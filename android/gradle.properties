org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 실제 휴대폰에서 PC 서버에 HTTP로 접속할 때만 PC의 LAN IP를 지정한다 (debug 빌드 전용).
# 예: gradlew assembleDebug -PafterstopDevHost=192.168.0.10
afterstopDevHost=
# 작업 폴더 경로에 한글이 있어 AGP 경로 검사를 끈다. 실제 빌드·테스트 통과로 확인함(docs/VERIFICATION.md).
android.overridePathCheck=true
